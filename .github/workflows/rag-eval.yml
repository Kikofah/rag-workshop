name: rag-eval

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้ง requirements
        run: pip install -r requirements.txt

      - name: pytest
        run: pytest -q

      - name: วัดผลการค้นคืน (dev)
        # rag.evaluate เขียนตารางลง $GITHUB_STEP_SUMMARY เอง และ exit 1 ถ้า hit@4 < 0.9
        run: python -m rag.evaluate --split dev --method tfidf -k 4 --min-hit 0.9
